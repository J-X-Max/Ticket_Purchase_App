<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- rel="icon"：这是告诉浏览器“这个链接 (href) 指向的文件，是这个网页的图标”。这是 HTML5 的标准属性，所有现代浏览器都认这个。
type="image/svg+xml"：明确图标类型是 SVG。SVG 是矢量图，无限放大不失真，且支持暗黑模式自适应，是目前最推荐的图标格式。 -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- <link rel="shortcuticon" type="image/x-icon" href="/vite.svg">    shortcuticon,这整个字符串是IE8及更早浏览器对“网站图标”的私有命名。-->
  <!-- image/x-icon：这是 .ico 文件的 MIME 类型。
它带有 x- 前缀，表示实验性类型。早期微软提出用它，但没成为正式标准。后来被标准化为 image/vnd.microsoft.icon，但 image/x-icon 因历史惯性保留至今。
现在多数服务器和浏览器都兼容这两种写法。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>jxhapp</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
